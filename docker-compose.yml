services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maryme
      POSTGRES_USER: maryme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U maryme"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maryme:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/maryme?schema=public
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
volumes: { postgres_data: {} }
