services:
  mongodb:
    image: mongo:8.0.12
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongodb_data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init-replica:
    image: mongo:8.0.12
    depends_on:
      mongodb: { condition: service_healthy }
    restart: 'no'
    entrypoint: ['bash', '-c']
    command:
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status() }
          catch (error) {
            if (error.codeName === "NotYetInitialized") {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
            } else { throw error }
          }
          while (!db.hello().isWritablePrimary) { sleep(500) }
        '

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/maryme?replicaSet=rs0
    ports: ['4000:4000']
    depends_on:
      mongo-init-replica: { condition: service_completed_successfully }

volumes:
  mongodb_data: {}
