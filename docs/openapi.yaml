openapi: 3.0.3
info: { title: Maryme API, version: 1.0.0 }
servers: [{ url: http://localhost:4000/api/v1 }]
security: [{ bearerAuth: [] }]
paths:
  /health:
    get: { security: [], responses: { '200': { description: Healthy } } }
  /auth/login:
    post:
      security: []
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } },
        }
      responses:
        {
          '200':
            {
              description: Authenticated,
              headers: { Set-Cookie: { schema: { type: string } } },
              content:
                { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } },
            },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /auth/refresh:
    post:
      {
        security: [{ refreshCookie: [] }],
        responses:
          {
            '200':
              {
                description: Rotated session,
                content:
                  { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } },
              },
            '401': { $ref: '#/components/responses/Error' },
          },
      }
  /auth/logout:
    post: { security: [{ refreshCookie: [] }], responses: { '204': { description: Logged out } } }
  /auth/me:
    get:
      {
        responses:
          {
            '200':
              {
                description: Current user,
                content: { application/json: { schema: { $ref: '#/components/schemas/User' } } },
              },
            '401': { $ref: '#/components/responses/Error' },
          },
      }
  /couples:
    get:
      {
        parameters:
          [
            { $ref: '#/components/parameters/Page' },
            { $ref: '#/components/parameters/Limit' },
            {
              in: query,
              name: status,
              schema: { type: string, enum: [PENDING, AUTHORIZED, SUSPENDED] },
            },
            { in: query, name: search, schema: { type: string } },
          ],
        responses: { '200': { description: Couples page } },
      }
    post:
      {
        requestBody:
          {
            required: true,
            content: { application/json: { schema: { $ref: '#/components/schemas/Couple' } } },
          },
        responses: { '201': { description: Created } },
      }
  /couples/{coupleId}/guests:
    parameters: [{ $ref: '#/components/parameters/CoupleId' }]
    get:
      {
        parameters:
          [
            { $ref: '#/components/parameters/Page' },
            {
              in: query,
              name: limit,
              schema: { type: integer, minimum: 1, maximum: 500, default: 50 },
            },
            { in: query, name: search, schema: { type: string } },
            { in: query, name: side, schema: { type: string, enum: [GROOM, BRIDE] } },
            { in: query, name: family, schema: { type: string } },
            {
              in: query,
              name: category,
              schema:
                {
                  type: string,
                  enum: [BRIDE_FAMILY, GROOM_FAMILY, WITNESS, FRIENDS, COLLEAGUES, VIP],
                },
            },
            {
              in: query,
              name: rsvpStatus,
              schema: { type: string, enum: [CONFIRMED, PENDING, DECLINED] },
            },
            { in: query, name: tableNumber, schema: { type: string } },
            { in: query, name: hasPhone, schema: { type: boolean } },
            { in: query, name: invitationSent, schema: { type: boolean } },
            { in: query, name: checkedIn, schema: { type: boolean } },
          ],
        responses:
          { '200': { description: Guests page }, '403': { $ref: '#/components/responses/Error' } },
      }
    post:
      {
        requestBody:
          {
            required: true,
            content: { application/json: { schema: { $ref: '#/components/schemas/Guest' } } },
          },
        responses:
          { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } },
      }
  /couples/{coupleId}/guests/bulk:
    post:
      {
        parameters: [{ $ref: '#/components/parameters/CoupleId' }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [mode, guests],
                        properties:
                          {
                            mode: { type: string, enum: [append, replace] },
                            guests:
                              {
                                type: array,
                                maxItems: 1000,
                                items: { $ref: '#/components/schemas/Guest' },
                              },
                          },
                      },
                  },
              },
          },
        responses:
          {
            '201': { description: Bulk result },
            '409': { description: Quota exceeded or replace forbidden after check-in },
          },
      }
  /couples/{coupleId}/checkins:
    get:
      {
        parameters:
          [
            { $ref: '#/components/parameters/CoupleId' },
            { $ref: '#/components/parameters/Page' },
            { $ref: '#/components/parameters/Limit' },
            { in: query, name: search, schema: { type: string } },
          ],
        responses:
          {
            '200': { description: Check-in page },
            '403': { $ref: '#/components/responses/Error' },
          },
      }
  /access/context:
    get:
      description: Minimal wedding context for the authenticated ACCESS_AGENT.
      responses:
        '200':
          {
            description: Access context,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AccessContext' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /couples/{coupleId}/access-agents:
    get:
      description: List access agents (SUPER_ADMIN only).
      parameters: [{ $ref: '#/components/parameters/CoupleId' }]
      responses:
        '200':
          {
            description: Access agents,
            content:
              {
                application/json:
                  { schema: { type: array, items: { $ref: '#/components/schemas/AccessAgent' } } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
    post:
      {
        description: SUPER_ADMIN only,
        parameters: [{ $ref: '#/components/parameters/CoupleId' }],
        requestBody:
          {
            required: true,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AccessAgentRequest' } } },
          },
        responses:
          {
            '201': { description: Access agent created },
            '403': { $ref: '#/components/responses/Error' },
          },
      }
  /couples/{coupleId}/access-agents/{agentId}:
    patch:
      description: Update an access agent (SUPER_ADMIN only).
      parameters:
        [
          { $ref: '#/components/parameters/CoupleId' },
          { in: path, name: agentId, required: true, schema: { type: string } },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UpdateAccessAgentRequest' } },
            },
        }
      responses:
        {
          '200': { description: Updated access agent },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /couples/{coupleId}/access-agents/{agentId}/reset-password:
    post:
      description: Reset an access-agent password and revoke all refresh sessions (SUPER_ADMIN only).
      parameters:
        [
          { $ref: '#/components/parameters/CoupleId' },
          { in: path, name: agentId, required: true, schema: { type: string } },
        ]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } },
        }
      responses:
        {
          '201': { description: Password reset },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
        }
  /guests/{guestId}/invitations:
    parameters: [{ in: path, name: guestId, required: true, schema: { type: string } }]
    get: { responses: { '200': { description: Invitations } } }
    post:
      {
        requestBody:
          {
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            expiresAt: { type: string, format: date-time },
                            revokePrevious:
                              {
                                type: boolean,
                                default: false,
                                description: Explicitly revoke older active QR codes,
                              },
                          },
                      },
                  },
              },
          },
        responses: { '201': { description: Generated with one-time raw token } },
      }
  /guests/{guestId}/invitation-sent:
    post:
      summary: Idempotently mark an invitation as sent without generating or changing its QR
      parameters: [{ in: path, name: guestId, required: true, schema: { type: string } }]
      responses:
        '201':
          description: Existing or newly-created sent timestamp
          content:
            application/json: { schema: { $ref: '#/components/schemas/InvitationSent' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /guests/{guestId}/invitation-status:
    get:
      summary: Return independent card, delivery, artifact, and check-in status
      parameters: [{ in: path, name: guestId, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Invitation lifecycle status
          content:
            application/json: { schema: { $ref: '#/components/schemas/InvitationStatus' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /couples/{coupleId}/invitations/mark-sent:
    post:
      summary: Idempotently mark owned, non-deleted guests' invitations as sent
      parameters: [{ $ref: '#/components/parameters/CoupleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestIds]
              properties:
                guestIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string } }
      responses:
        '201':
          description: Count accepted and IDs rejected because they are absent, deleted, or foreign
          content:
            application/json:
              schema:
                type: object
                required: [updated, failed]
                properties:
                  updated: { type: integer }
                  failed: { type: array, items: { type: string } }
        '403': { $ref: '#/components/responses/Error' }
  /invitations/{id}/revoke:
    post:
      {
        parameters: [{ in: path, name: id, required: true, schema: { type: string } }],
        responses: { '201': { description: Revoked } },
      }
  /checkins/validate:
    post:
      {
        description: RSVP PENDING and DECLINED remain admissible and produce explicit warnings,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [token],
                        properties: { token: { type: string, minLength: 32 } },
                      },
                  },
              },
          },
        responses:
          {
            '201':
              {
                description: Minimal access validation result with existing check-in details,
                content:
                  {
                    application/json:
                      { schema: { $ref: '#/components/schemas/CheckInValidation' } },
                  },
              },
            '404': { description: QR_INVALID },
            '403':
              {
                description: QR_REVOKED,
                QR_EXPIRED,
                GUEST_DELETED,
                WRONG_WEDDING,
                EVENT_NOT_OPEN or EVENT_CLOSED,
              },
            '429': { $ref: '#/components/responses/Error' },
          },
      }
  /checkins:
    post:
      {
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [token],
                        properties:
                          {
                            token: { type: string },
                            deviceId: { type: string, maxLength: 128 },
                            stationName: { type: string, maxLength: 100 },
                          },
                      },
                  },
              },
          },
        responses:
          {
            '201':
              {
                description: Checked in,
                content: { application/json: { schema: { $ref: '#/components/schemas/CheckIn' } } },
              },
            '409': { $ref: '#/components/responses/Error' },
          },
      }
  /couples/{coupleId}/guests/import:
    post:
      summary: Preview or commit an idempotent normalized spreadsheet merge
      description: Empty fields preserve existing values; __CLEAR__ explicitly clears nullable text. Check-in and invitation-download fields are never imported.
      responses:
        {
          '200': { description: Import preview/result },
          '409': { $ref: '#/components/responses/Error' },
        }
  /guests/{guestId}/coupons:
    put:
      summary: Replace a guest numbered-coupon assignment
      responses:
        {
          '200': { description: Assigned coupons },
          '409': { $ref: '#/components/responses/Error' },
        }
  /couples/{coupleId}/coupons:
    get:
      summary: List numbered coupons
      parameters:
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [AVAILABLE, ASSIGNED, USED, VOID] },
          }
        - { in: query, name: guestId, schema: { type: string } }
        - { in: query, name: number, schema: { type: integer } }
      responses: { '200': { description: Coupon page } }
  /couples/{coupleId}/coupons/summary:
    get:
      summary: Count available, assigned, used, and void coupons
      responses: { '200': { description: Coupon pool summary } }
  /couples/{coupleId}/coupons/reconcile:
    post:
      summary: Backfill and reconcile legacy guest coupon counts
      responses:
        {
          '200': { description: Reconciliation report },
          '409': { $ref: '#/components/responses/Error' },
        }
  /couples/{coupleId}/invitation-designs:
    get:
      summary: List invitation designs (owner or SUPER_ADMIN)
      parameters: [{ $ref: '#/components/parameters/CoupleId' }]
      responses: { '200': { description: Safe designs; storage keys are omitted } }
    post:
      summary: Create an invitation design
      parameters: [{ $ref: '#/components/parameters/CoupleId' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateInvitationDesign' } }
      responses:
        '201': { description: Created safe design }
        '400': { $ref: '#/components/responses/Error' }
  /couples/{coupleId}/invitation-designs/{designId}:
    parameters:
      - { $ref: '#/components/parameters/CoupleId' }
      - { in: path, name: designId, required: true, schema: { type: string } }
    get: { summary: Get a safe invitation design, responses: { '200': { description: Design } } }
    patch:
      summary: Update an invitation design without changing its immutable mode
      requestBody:
        content:
          { application/json: { schema: { $ref: '#/components/schemas/UpdateInvitationDesign' } } }
      responses: { '200': { description: Updated design } }
    delete: { summary: Delete an unused design, responses: { '204': { description: Deleted } } }
  /couples/{coupleId}/invitation-designs/{designId}/activate:
    post:
      summary: Make this the couple's active design
      parameters:
        - { $ref: '#/components/parameters/CoupleId' }
        - { in: path, name: designId, required: true, schema: { type: string } }
      responses: { '201': { description: Activated design } }
  /couples/{coupleId}/invitation-designs/{designId}/background:
    parameters:
      - { $ref: '#/components/parameters/CoupleId' }
      - { in: path, name: designId, required: true, schema: { type: string } }
    post:
      summary: Upload a private PNG, JPEG, or WebP background (maximum 10 MiB by default)
      description: The new object is persisted before the database pointer changes; a failed upload leaves the previous background intact. PDF is intentionally rejected because browser canvas rendering requires a raster image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses: { '201': { description: Safe design metadata; no object key } }
    get:
      summary: Download the private background
      responses:
        '200':
          description: Original background with its stored Content-Type
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /invitations/{invitationId}/artifact:
    post:
      summary: Store an artifact derived from the invitation's guest and couple
      parameters: [{ in: path, name: invitationId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [designId]
              properties:
                designId: { type: string }
                image: { type: string, format: binary, description: PNG, JPEG, or WebP }
                pdf: { type: string, format: binary }
              description: At least image or pdf is required.
      responses:
        {
          '201':
            {
              description: Safe artifact,
              content:
                {
                  application/json: { schema: { $ref: '#/components/schemas/InvitationArtifact' } },
                },
            },
        }
  /couples/{coupleId}/invitation-artifacts:
    get:
      summary: List and filter a couple's artifacts
      parameters:
        - { $ref: '#/components/parameters/CoupleId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { in: query, name: guestId, schema: { type: string } }
        - { in: query, name: stale, schema: { type: boolean } }
      responses:
        '200':
          description: Paginated artifacts
          content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactPage' } } }
  /invitation-artifacts/{artifactId}/download:
    get:
      summary: Download an owned artifact format
      parameters:
        - { in: path, name: artifactId, required: true, schema: { type: string } }
        - { in: query, name: format, required: true, schema: { type: string, enum: [image, pdf] } }
      responses:
        {
          '200': { description: File with stored Content-Type and attachment disposition },
          '404': { $ref: '#/components/responses/Error' },
        }
  /invitation-artifacts/{artifactId}/share-link:
    post:
      summary: Create an additional active opaque share link
      parameters: [{ in: path, name: artifactId, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, properties: { expiresAt: { type: string, format: date-time } } },
              },
          }
      responses: { '201': { description: id, one-time shareUrl, and capped expiresAt } }
  /invitation-artifacts/{artifactId}/share-links:
    get:
      summary: List active, unexpired share-link metadata only
      parameters: [{ in: path, name: artifactId, required: true, schema: { type: string } }]
      responses: { '200': { description: No token hash or reconstructable URL is returned } }
  /public/invitations/share/{token}:
    get:
      security: []
      summary: Open an opaque public share (image preferred over PDF)
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      responses:
        '200':
          {
            description: File with Content-Type,
            attachment disposition,
            and private no-store cache policy,
          }
        '404': { description: Unknown token }
        '410': { description: Expired or revoked token }
  /invitation-share-links/{id}/revoke:
    post:
      summary: Revoke exactly one owned share link without affecting its QR invitation
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            description: Share-link ID,
            schema: { type: string },
          },
        ]
      responses: { '201': { description: id and revokedAt } }
  /couples/{coupleId}/tables:
    parameters: [{ $ref: '#/components/parameters/CoupleId' }]
    get:
      summary: List numeric wedding tables with occupancy
      responses: { '200': { description: Wedding tables } }
    post:
      summary: Create a numeric wedding table
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/WeddingTableInput' } } },
        }
      responses:
        { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } }
  /couples/{coupleId}/tables/bulk:
    parameters: [{ $ref: '#/components/parameters/CoupleId' }]
    post:
      summary: Create or update several tables by number
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [tables],
                      properties:
                        {
                          tables:
                            {
                              type: array,
                              items: { $ref: '#/components/schemas/WeddingTableInput' },
                            },
                        },
                    },
                },
            },
        }
      responses: { '201': { description: Configured } }
  /couples/{coupleId}/tables/generate:
    parameters: [{ $ref: '#/components/parameters/CoupleId' }]
    post:
      summary: Generate a complete numeric table plan from configurable ranges
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/TableGeneration' } } },
        }
      responses:
        { '201': { description: Generated }, '400': { $ref: '#/components/responses/Error' } }
  /couples/{coupleId}/tables/summary:
    parameters: [{ $ref: '#/components/parameters/CoupleId' }]
    get:
      summary: Table counts, capacities and occupied coupon seats
      responses: { '200': { description: Seating summary } }
  /couples/{coupleId}/tables/{tableId}:
    parameters:
      - { $ref: '#/components/parameters/CoupleId' }
      - { in: path, name: tableId, required: true, schema: { type: string } }
    patch:
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/WeddingTableInput' } } },
        }
      responses: { '200': { description: Updated } }
    delete:
      responses:
        { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } }
  /couples/{coupleId}/tables/{tableId}/guests/{guestId}:
    parameters:
      - { $ref: '#/components/parameters/CoupleId' }
      - { in: path, name: tableId, required: true, schema: { type: string } }
      - { in: path, name: guestId, required: true, schema: { type: string } }
    patch:
      summary: Assign a guest to the table, enforcing side and coupon capacity
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties: { allowSideOverride: { type: boolean, default: false } },
                    },
                },
            },
        }
      responses:
        { '200': { description: Assigned }, '409': { $ref: '#/components/responses/Error' } }
  /couples/{coupleId}/guests/{guestId}/table:
    parameters:
      - { $ref: '#/components/parameters/CoupleId' }
      - { in: path, name: guestId, required: true, schema: { type: string } }
    patch:
      summary: Assign or unassign a guest using WeddingTable as the source of truth
      description: Send a WeddingTable ID to assign, or null to unassign. tableNumber is maintained only as a legacy projection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableId]
              properties:
                tableId: { type: string, nullable: true }
                allowSideOverride: { type: boolean, default: false }
      responses:
        {
          '200': { description: Assigned or unassigned },
          '409': { $ref: '#/components/responses/Error' },
        }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: maryme_refresh }
  parameters:
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    CoupleId: { in: path, name: coupleId, required: true, schema: { type: string } }
  responses:
    Error:
      {
        description: Error,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } },
      }
  schemas:
    WeddingTableInput:
      type: object
      required: [number, side]
      properties:
        number: { type: integer, minimum: 1 }
        side: { type: string, enum: [GROOM, BRIDE] }
        capacity: { type: integer, minimum: 1, nullable: true }
    TableGeneration:
      type: object
      required: [totalTables, rules]
      properties:
        totalTables: { type: integer, minimum: 1 }
        replace: { type: boolean, default: false }
        rules:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer, minimum: 1 }
              to: { type: integer, minimum: 1 }
              side: { type: string, enum: [GROOM, BRIDE] }
              oddSide: { type: string, enum: [GROOM, BRIDE] }
              evenSide: { type: string, enum: [GROOM, BRIDE] }
              capacity: { type: integer, minimum: 1 }
    OverlayItem:
      type: object
      additionalProperties: false
      required: [enabled, x, y]
      properties:
        enabled: { type: boolean }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
    OverlayConfig:
      type: object
      additionalProperties: false
      properties:
        qr: { $ref: '#/components/schemas/OverlayItem' }
        guestName: { $ref: '#/components/schemas/OverlayItem' }
        family: { $ref: '#/components/schemas/OverlayItem' }
        category: { $ref: '#/components/schemas/OverlayItem' }
        table: { $ref: '#/components/schemas/OverlayItem' }
        coupons: { $ref: '#/components/schemas/OverlayItem' }
        assignedSeats: { $ref: '#/components/schemas/OverlayItem' }
    CreateInvitationDesign:
      type: object
      additionalProperties: false
      description: For UPLOADED, templateKey is forbidden and overlayConfig may be empty; upload a raster background before activation. For GENERATED, templateKey is required. Create a second design instead of changing modes.
      required: [name, mode, overlayConfig]
      properties:
        name: { type: string, minLength: 1 }
        mode: { type: string, enum: [GENERATED, UPLOADED] }
        templateKey:
          {
            type: string,
            minLength: 1,
            description: Required for GENERATED and forbidden for UPLOADED,
          }
        canvasWidth: { type: integer, minimum: 1 }
        canvasHeight: { type: integer, minimum: 1 }
        overlayConfig: { $ref: '#/components/schemas/OverlayConfig' }
        contentConfig: { type: object, additionalProperties: false }
    UpdateInvitationDesign:
      type: object
      additionalProperties: false
      description: All properties are optional on PATCH. mode cannot be changed; create another design so imported files are never destroyed.
      properties:
        name: { type: string }
        mode: { type: string, enum: [GENERATED, UPLOADED] }
        templateKey: { type: string }
        canvasWidth: { type: integer, minimum: 1 }
        canvasHeight: { type: integer, minimum: 1 }
        overlayConfig: { $ref: '#/components/schemas/OverlayConfig' }
        contentConfig: { type: object, additionalProperties: false }
    InvitationArtifact:
      type: object
      additionalProperties: false
      required: [id, guestId, invitationId, designId, generatedAt, hasImage, hasPdf, stale]
      properties:
        id: { type: string }
        guestId: { type: string }
        invitationId: { type: string }
        designId: { type: string }
        generatedAt: { type: string, format: date-time }
        hasImage: { type: boolean }
        hasPdf: { type: boolean }
        stale: { type: boolean }
    ArtifactPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/InvitationArtifact' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    LoginRequest:
      {
        type: object,
        required: [email, password],
        properties: { email: { type: string, format: email }, password: { type: string } },
      }
    LoginResponse:
      {
        type: object,
        required: [accessToken, user],
        properties: { accessToken: { type: string }, user: { $ref: '#/components/schemas/User' } },
      }
    User:
      {
        type: object,
        required: [id, email, role],
        properties:
          {
            id: { type: string },
            email: { type: string, format: email },
            phone: { type: string, nullable: true },
            role: { type: string, enum: [SUPER_ADMIN, COUPLE, ACCESS_AGENT] },
            coupleId: { type: string, nullable: true },
            firstName: { type: string, nullable: true },
            lastName: { type: string, nullable: true },
          },
      }
    AccessAgentRequest:
      {
        type: object,
        required: [email, phone, password, name],
        properties:
          {
            email: { type: string, format: email },
            phone: { type: string },
            password: { type: string, minLength: 6 },
            name: { type: string, maxLength: 100 },
          },
      }
    UpdateAccessAgentRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string }
        isActive: { type: boolean }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 6 }
    AccessAgent:
      type: object
      required: [id, name, email, phone, isActive, coupleId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        isActive: { type: boolean }
        coupleId: { type: string }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    AccessContext:
      type: object
      required: [coupleId, partner1, partner2, weddingDate, location, status]
      properties:
        coupleId: { type: string }
        partner1: { type: string }
        partner2: { type: string }
        weddingDate: { type: string, format: date-time }
        location: { type: string }
        accessOpensAt: { type: string, format: date-time, nullable: true }
        accessClosesAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [AUTHORIZED] }
    Couple:
      {
        type: object,
        properties:
          {
            id: { type: string },
            partner1: { type: string },
            partner2: { type: string },
            weddingDate: { type: string, format: date-time },
            accessOpensAt: { type: string, format: date-time, nullable: true },
            accessClosesAt:
              {
                type: string,
                format: date-time,
                nullable: true,
                description: Must be later than accessOpensAt when both are set; otherwise INVALID_ACCESS_WINDOW.,
              },
            status: { type: string, enum: [PENDING, AUTHORIZED, SUSPENDED] },
            guestQuota: { type: integer },
          },
      }
    Guest:
      {
        type: object,
        properties:
          {
            id: { type: string },
            firstName: { type: string },
            lastName: { type: string },
            side: { type: string, enum: [GROOM, BRIDE] },
            category:
              {
                type: string,
                enum: [GROOM_FAMILY, BRIDE_FAMILY, WITNESS, FRIENDS, COLLEAGUES, VIP],
              },
            rsvpStatus: { type: string, enum: [CONFIRMED, PENDING, DECLINED] },
            dietary:
              {
                type: string,
                enum: [STANDARD, VEGETARIAN, VEGAN, GLUTEN_FREE, CHILD_MENU, HALAL, NO_SEAFOOD],
              },
          },
      }
    Invitation:
      {
        type: object,
        properties:
          {
            id: { type: string },
            guestId: { type: string },
            status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] },
            token: { type: string, description: Present only in generation response },
          },
      }
    InvitationSent:
      type: object
      required: [guestId, invitationSentDate]
      properties:
        guestId: { type: string }
        invitationSentDate: { type: string, format: date-time }
    InvitationStatus:
      type: object
      required: [guestId, generated, artifactReady, cardStatus, sent, checkedIn]
      properties:
        guestId: { type: string }
        generated: { type: boolean }
        artifactReady: { type: boolean }
        cardStatus: { type: string, enum: [NOT_GENERATED, GENERATED, STALE] }
        sent: { type: boolean }
        sentAt: { type: string, format: date-time, nullable: true }
        checkedIn: { type: boolean }
    CheckIn:
      type: object
      properties:
        id: { type: string }
        guestId: { type: string }
        coupleId: { type: string }
        checkedInAt: { type: string, format: date-time }
        deviceId: { type: string, nullable: true }
        stationName: { type: string, nullable: true, maxLength: 100 }
        operatorId: { type: string, nullable: true }
        status: { type: string, enum: [VALID, DUPLICATE, REJECTED] }
        guest:
          type: object
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            tableNumber: { type: string, nullable: true }
            assignedSeats: { type: array, items: { type: string } }
            coupons: { type: integer }
            side: { type: string, enum: [GROOM, BRIDE] }
            category: { type: string }
            rsvpStatus: { type: string, enum: [CONFIRMED, PENDING, DECLINED] }
    CheckInValidation:
      type: object
      required: [valid, alreadyCheckedIn, guest]
      properties:
        valid: { type: boolean, enum: [true] }
        alreadyCheckedIn: { type: boolean }
        guest:
          type: object
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            tableNumber: { type: string, nullable: true }
            assignedSeats: { type: array, items: { type: string } }
            coupons: { type: integer }
            side: { type: string, enum: [GROOM, BRIDE] }
            category: { type: string }
            rsvpStatus: { type: string, enum: [CONFIRMED, PENDING, DECLINED] }
        checkIn:
          type: object
          nullable: true
          properties:
            checkedInAt: { type: string, format: date-time }
            deviceId: { type: string, nullable: true }
            stationName: { type: string, nullable: true }
            operatorName: { type: string, nullable: true }
    PaginationMeta:
      {
        type: object,
        required: [page, limit, total, totalPages],
        properties:
          {
            page: { type: integer },
            limit: { type: integer },
            total: { type: integer },
            totalPages: { type: integer },
          },
      }
    ErrorResponse:
      {
        type: object,
        required: [status, code, message],
        properties:
          {
            status: { type: integer },
            code: { type: string },
            message: { type: string },
            details: { type: object },
          },
      }
