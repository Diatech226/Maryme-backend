name: CI
on: [push, pull_request]

env:
  DATABASE_URL: mongodb://localhost:27017/maryme_test?replicaSet=rs0&directConnection=true
  NODE_ENV: test
  CORS_ORIGINS: http://localhost:3000
  FRONTEND_URL: http://localhost:3000
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Configure MongoDB replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8.0.12 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --quiet --eval 'quit(db.adminCommand("ping").ok ? 0 : 1)'; do sleep 1; done
          docker exec mongodb \
            mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          until docker exec mongodb \
            mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma db push
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  windows-prisma-client:
    name: Windows Prisma client and TypeScript
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run build
