name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: maryme_test, POSTGRES_USER: maryme, POSTGRES_PASSWORD: test_password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maryme -d maryme_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://maryme:test_password@localhost:5432/maryme_test?schema=public
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  windows-prisma-client:
    name: Windows Prisma client and TypeScript
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # npm ci invokes postinstall, which generates the client on the Windows host.
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
